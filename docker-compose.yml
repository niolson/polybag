services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APT_CACHE_BUST: ${APT_CACHE_BUST:-1}
    restart: unless-stopped
    # Hosted-mode secret injection. On our multi-tenant server this file holds
    # the secrets shared across every tenant — Redis password, Google SSO, OAuth
    # broker secret — so they are not copied into each tenant's .env. It exists
    # nowhere else, and `required: false` makes its absence a no-op rather than
    # an error: if you are self-hosting, ignore it and put everything in .env.
    #
    # Deliberately not `env_file: .env`. That would inject these as OS-level
    # environment variables, which take precedence over the mounted .env file
    # and are then invisible to `config:clear`. See AGENTS.md.
    env_file:
      - path: /opt/shared/shared-secrets.env
        required: false
    environment:
      QZ_PRIVATE_KEY_PATH: ./storage/app/private/qz-private-key.pem
      QZ_CERTIFICATE_PATH: ./public/qz-certificate.pem
    volumes:
      - ./.env:/var/www/html/.env
      - ${QZ_PRIVATE_KEY_PATH:-./storage/app/private/qz-private-key.pem}:/var/www/html/storage/app/private/qz-private-key.pem:ro
      - ${QZ_CERTIFICATE_PATH:-./public/qz-certificate.pem}:/var/www/html/public/qz-certificate.pem:ro
      - ./storage/app/private/ssh:/var/www/html/storage/app/private/ssh
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - default
      - shared
    # `php artisan --version` used to be the probe here, which succeeds the
    # instant the container starts — before entrypoint.sh has run a single
    # migration. Callers that wait for `(healthy)` and then recreate the
    # container therefore killed `migrate` mid-run, committing a CREATE TABLE
    # without its `migrations` row and leaving the app in a crash loop on the
    # next boot. Probe php-fpm instead: the entrypoint only execs it after
    # migrate and optimize finish, so accepting a connection on 9000 is the
    # first moment the container is genuinely serving.
    #
    # start_period covers a cold first boot migrating the full schema; failures
    # inside it are not counted, and the first success ends it immediately.
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    restart: unless-stopped
    volumes:
      - ${QZ_CERTIFICATE_PATH:-./public/qz-certificate.pem}:/var/www/html/public/qz-certificate.pem:ro
    networks:
      - default
      - proxy
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Prepares the keyring volume before MySQL starts. Without this a fresh
  # install cannot bring up encryption at rest at all: the mysql image's
  # entrypoint runs `mysqld --verbose --help` as root before dropping to the
  # mysql user, which loads the keyring component and creates the key file
  # owned by root. The real mysqld then cannot read it, reports "Failed to
  # read keyring file", and aborts in a restart loop.
  #
  # Pre-creating the file as the mysql user avoids that. It never deletes or
  # truncates an existing keyring — losing it makes encrypted data
  # unrecoverable — it only creates the file when absent and fixes ownership.
  mysql-keyring-init:
    image: mysql:8.4@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
    profiles: [standalone]
    restart: "no"
    user: root
    volumes:
      - mysql-keyring:/var/lib/mysql-keyring
    command:
      - sh
      - -c
      - |
        set -e
        DIR=/var/lib/mysql-keyring
        KEYFILE=$$DIR/component_keyring_file
        LEGACY=$$DIR/keyring

        # Refuse to start while a plugin-era keyring still holds key material.
        #
        # Deliberately does NOT try to decide whether migration already
        # happened by looking at the component keyring: a FAILED migration
        # also leaves a component_keyring_file behind, and normal startup
        # writes a valid-but-keyless one. Neither existence nor size
        # distinguishes "migrated" from "never migrated", so the only safe
        # reading of a non-empty legacy keyring is that it may hold the sole
        # copy of the keys.
        #
        # Clearing this is an explicit human action: migrate on MySQL 8.0,
        # confirm encrypted tables actually read, then rename the legacy file.
        # See infra/README.md.
        if [ -s "$$LEGACY" ]; then
          echo "ERROR: legacy plugin keyring $$LEGACY still holds key material." >&2
          echo "Refusing to start: if those keys were never migrated to the keyring" >&2
          echo "component, encrypted tables would be unreadable, and the component" >&2
          echo "keyring's existence does not prove that migration succeeded." >&2
          echo "" >&2
          echo "Migrate on MySQL 8.0, verify you can read encrypted tables, then" >&2
          echo "archive the legacy keyring to acknowledge it:" >&2
          echo "  mv $$LEGACY $$LEGACY.migrated" >&2
          echo "See infra/README.md for what these files do." >&2
          exit 1
        fi

        if [ ! -e "$$KEYFILE" ]; then
          install -o 999 -g 999 -m 640 /dev/null "$$KEYFILE"
        fi
        chown 999:999 "$$DIR" "$$KEYFILE"

  mysql:
    image: mysql:8.4@sha256:3466ba4a4828aa8d46fb7c3bc16b67b781c98413cf4ea0fac6feaa6e881faa26
    restart: unless-stopped
    profiles: [standalone]
    depends_on:
      mysql-keyring-init:
        condition: service_completed_successfully
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-keyring:/var/lib/mysql-keyring
      # All three are required together: mysql.cnf turns encryption on, while
      # mysqld.my and component_keyring_file.cnf activate and configure the
      # keyring component that supplies the keys. Mounting mysql.cnf alone
      # leaves 8.4 with encryption enabled and no keyring to encrypt with.
      # Shared by the shared-server deployment — see infra/README.md.
      - ./infra/shared/mysql.cnf:/etc/mysql/conf.d/encryption.cnf:ro
      - ./infra/shared/mysqld.my:/usr/sbin/mysqld.my:ro
      - ./infra/shared/component_keyring_file.cnf:/usr/lib64/mysql/plugin/component_keyring_file.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    profiles: [standalone]
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APT_CACHE_BUST: ${APT_CACHE_BUST:-1}
    restart: unless-stopped
    # Hosted-mode secret injection; ignorable when self-hosting — see `app`.
    env_file:
      - path: /opt/shared/shared-secrets.env
        required: false
    volumes:
      - ./.env:/var/www/html/.env
    entrypoint: ["sh", "-c", "php artisan config:cache && php artisan queue:work --queue=default,low --tries=3"]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - default
      - shared

  import-queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APT_CACHE_BUST: ${APT_CACHE_BUST:-1}
    restart: unless-stopped
    # Hosted-mode secret injection; ignorable when self-hosting — see `app`.
    env_file:
      - path: /opt/shared/shared-secrets.env
        required: false
    volumes:
      - ./.env:/var/www/html/.env
    entrypoint: ["sh", "-c", "php artisan config:cache && php artisan queue:work imports --queue=imports --tries=3"]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - default
      - shared

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        APT_CACHE_BUST: ${APT_CACHE_BUST:-1}
    restart: unless-stopped
    # Hosted-mode secret injection; ignorable when self-hosting — see `app`.
    env_file:
      - path: /opt/shared/shared-secrets.env
        required: false
    volumes:
      - ./.env:/var/www/html/.env
    entrypoint: ["sh", "-c", "php artisan config:cache && php artisan schedule:work"]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
    networks:
      - default
      - shared

volumes:
  mysql-data:
  mysql-keyring:
  redis-data:

networks:
  proxy:
    external: true
  shared:
    external: true
    # Per-tenant isolation: in shared mode each tenant joins its own
    # `shared-<tenant>` network (the shared datastores are attached to all of
    # them), so tenants can reach MySQL/Redis/Gotenberg but not each other.
    # Defaults to the flat `shared` network for standalone/on-prem. See issue 16.
    name: ${SHARED_NETWORK:-shared}
