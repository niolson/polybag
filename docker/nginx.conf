server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Don't leak the nginx version string in Server headers / error pages
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NOTE: Content-Security-Policy is set by App\Http\Middleware\ContentSecurityPolicy
    # (single source of truth, works locally under Valet too), not here.

    # Serve Vite-built assets with long-lived caching.
    # nginx does not inherit server-level add_header directives into a location
    # that sets its own, so the security headers above must be repeated here or
    # they are silently dropped for /build/ responses.
    location /build/ {
        expires 30d;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location = /.well-known/appspecific/com.chrome.devtools.json { return 204; access_log off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        # Resolve the app container at request time, not at config parse time.
        # A literal `fastcgi_pass app:9000` is looked up once when nginx parses
        # this file and cached for the life of the worker, so nginx keeps
        # dialing the old address after app is recreated onto a new IP and
        # 502s every dynamic request until something restarts nginx.
        #
        # Both lines are required: nginx only defers resolution when the passed
        # address contains a variable, and a variable without a resolver is a
        # config error. 127.0.0.11 is Docker's embedded DNS, present on every
        # user-defined network; `valid=10s` bounds the stale window regardless
        # of the record's own TTL; these networks are IPv4 only.
        #
        # Trade-off: with a variable, an unresolvable `app` no longer stops
        # nginx from starting — it serves static assets and returns 502 for PHP
        # instead of refusing to boot.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Deny access to dotfiles
    location ~ /\.(?!well-known) {
        deny all;
    }
}
