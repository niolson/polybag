# On-premise override — publishes nginx ports directly (no Caddy)
#
# Usage:
#   docker compose --profile standalone -f docker-compose.yml -f docker-compose.onprem.yml up -d

services:
  nginx:
    ports:
      - "${APP_PORT:-80}:80"

  gotenberg:
    image: gotenberg/gotenberg:8@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    restart: unless-stopped
