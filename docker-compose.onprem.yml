# On-premise override — publishes nginx ports directly (no Caddy)
#
# Usage:
#   docker compose --profile standalone -f docker-compose.yml -f docker-compose.onprem.yml up -d

services:
  nginx:
    ports:
      - "${APP_PORT:-80}:80"

  gotenberg:
    image: gotenberg/gotenberg:8@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    restart: unless-stopped
