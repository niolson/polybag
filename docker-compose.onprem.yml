# On-premise override — publishes nginx ports directly (no Caddy)
#
# Usage:
#   docker compose --profile standalone -f docker-compose.yml -f docker-compose.onprem.yml up -d

services:
  nginx:
    ports:
      - "${APP_PORT:-80}:80"

  gotenberg:
    image: gotenberg/gotenberg:8@sha256:53073e798c8ef39ea2187e44cb67bab77894ea2509100b94c4fe3b461f7b2996
    restart: unless-stopped
