name: Security Audit

# Scoped so a branch with an open pull request does not run this workflow
# twice. Unfiltered `push` and `pull_request` both fire on such a push, and
# every job here reported to the PR twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Composer audit
        run: composer audit --locked --no-interaction

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: npm audit (high and above)
        run: npm audit --audit-level=high

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed via pipx with a pinned version rather than a third-party
      # action, to keep the supply-chain surface to the (immutable) PyPI release.
      - name: Install Semgrep
        run: pipx install semgrep==1.168.0

      # docker/nginx.conf deliberately re-declares all security headers inside
      # the /build/ location (nginx does not inherit add_header into a location
      # that sets its own). The generic header-redefinition rule is a pattern
      # matcher that flags every add_header in a location and cannot recognize
      # that fix, so it is excluded — the rest of p/security-audit still runs.
      - name: Run Semgrep
        run: >
          semgrep scan
          --config p/php
          --config p/javascript
          --config p/security-audit
          --config p/secrets
          --exclude-rule generic.nginx.security.header-redefinition.header-redefinition
          --exclude public/js
          --exclude public/build
          --error
          --skip-unknown-extensions

  hadolint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
