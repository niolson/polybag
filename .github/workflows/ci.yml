name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a pull request supersedes the run in flight. Runs on main are
# never cancelled, so every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      # Coverage is report-only (tech-debt PLAN #4), and pcov slows the suite
      # down, so only pushes to main measure it.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip, gd, intl, bcmath, pcntl
          coverage: ${{ github.event_name == 'push' && 'pcov' || 'none' }}

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      # Paratest, one process per core. See the "Testing" section of AGENTS.md
      # for why workers must not share state.
      - name: Run tests
        run: composer run ${{ github.event_name == 'push' && 'test:ci' || 'test' }}
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Upload coverage report
        if: ${{ github.event_name == 'push' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: warn

  # The `package_labels` unique index over a generated column is the production
  # guard for "at most one active label per package", and the suite runs on
  # SQLite. This runs the migrations from empty and the tests that exercise the
  # constraint, the backfill and the cascade against the engine production
  # relies on, so the migration is seen to work on MySQL before it reaches a
  # tenant. Not a second full suite: only tests in the `mysql` group.
  mysql:
    name: MySQL Migrations
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: polybag_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: polybag_test
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip, gd, intl, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations from empty
        run: php artisan migrate --force

      - name: Run MySQL-group tests
        run: php artisan test --compact --group=mysql

  # Pint, Rector and PHPStan are independent, so they run as parallel jobs
  # instead of one after another; the slowest of them sets the wall-clock time.
  # PHPStan keeps the "Static Analysis" name.
  static:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Code Style
            run: vendor/bin/pint --test
          # Rector is gated here for the same reason Pint is. It was previously
          # only reachable through `composer run format`, which writes in place,
          # so every branch that ran the documented format command picked up the
          # same backlog of unrelated files and had it reverted in review.
          # Nothing ever committed the fix, so the next branch rediscovered it.
          - name: Rector
            run: vendor/bin/rector process --dry-run --no-progress-bar
          # Dependency advisories are deliberately not gated here. The
          # security-audit workflow runs composer and npm audit on every push
          # and pull request across all branches, at the same --audit-level=high
          # the pre-push hook uses. Duplicating them in the merge gate meant an
          # overnight upstream advisory could block an unrelated branch.
          - name: Static Analysis
            run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No coverage driver: pcov costs startup time and nothing here measures
      # coverage.
      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip, gd, intl, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # Larastan boots the application container, so it needs an APP_KEY.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  browser:
    name: Browser Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, zip, gd, intl, bcmath, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Not parallelised: the browser suite is a handful of tests and each one
      # drives a real Chromium.
      - name: Run browser tests
        run: php artisan test tests/Browser/
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  # The image build and CVE scan take minutes and only a few kinds of change
  # can break them, so a pull request builds the image only when it touches
  # one of those. Every push to main still builds it, and
  # scheduled-rebuild.yml rebuilds and scans it weekly, so a new CVE in the
  # base image does not depend on a pull request to be found.
  docker-changes:
    name: Docker Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.filter.outputs.build }}

    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          if echo "$files" | grep -qE '^(Dockerfile|\.dockerignore|docker/|docker-compose[^/]*\.yml|composer\.(json|lock)|package(-lock)?\.json|vite\.config\.[a-z]+|\.github/workflows/ci\.yml)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Docker Build
    needs: docker-changes
    if: needs.docker-changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Get cache rotation keys
        id: date
        run: |
          echo "week=$(date +%Y-%U)" >> $GITHUB_OUTPUT
          echo "day=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Build app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          tags: polybag-app:ci
          load: true
          push: false
          # Rotates daily so the cached apt-get update/upgrade layer cannot go
          # stale for a whole week. Without it the CVE scan below fails on
          # Debian security patches published mid-week that a fresh build
          # would already have picked up.
          build-args: |
            APT_CACHE_BUST=${{ steps.date.outputs.day }}
          cache-from: type=gha,scope=app-${{ steps.date.outputs.week }}
          cache-to: type=gha,scope=app-${{ steps.date.outputs.week }},mode=max

      - name: Build nginx image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: nginx
          push: false
          cache-from: type=gha,scope=nginx-${{ steps.date.outputs.week }}
          cache-to: type=gha,scope=nginx-${{ steps.date.outputs.week }},mode=max

      - name: Scan app image for CVEs
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: polybag-app:ci
          severity-cutoff: high
          only-fixed: true
          fail-build: true
          output-format: table
